<head>

  <title>find for | Modern Career & Recruitment Platform (Standalone Preview)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              50: '#F0F3F8', 100: '#D9E0EC', 200: '#B0C0D7', 300: '#7E99BD',
              400: '#4F729F', 500: '#2A4D7C', 600: '#1D365C', 700: '#172B49',
              800: '#14213D', 900: '#0C1527', 950: '#070C17',
            },
            teal: {
              50: '#E8F8F7', 100: '#C7EFEF', 200: '#94E0DE', 300: '#5ACCC9',
              400: '#2BB5B1', 500: '#16A6A1', 600: '#118682', 700: '#106A68',
              800: '#115453', 900: '#124545',
            },
            amber: {
              50: '#FEF7EE', 100: '#FDECD7', 200: '#FBD8AE', 300: '#F7BD7E',
              400: '#F4A261', 500: '#EA7C31', 600: '#D95F22', 700: '#B4451C',
            },
            surface: { DEFAULT: '#F7F9FC' }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'soft': '0 4px 16px -2px rgba(20, 33, 61, 0.06), 0 2px 6px -1px rgba(20, 33, 61, 0.03)',
            'soft-lg': '0 10px 25px -3px rgba(20, 33, 61, 0.08), 0 4px 10px -2px rgba(20, 33, 61, 0.04)',
            'soft-xl': '0 20px 35px -5px rgba(20, 33, 61, 0.1), 0 8px 16px -4px rgba(20, 33, 61, 0.04)',
          }
        }
      }
    }
  </script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; background-color: #F7F9FC; color: #1e293b; }
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; }
    }
  </style>
</head>
<body class="bg-surface text-slate-800 antialiased selection:bg-teal-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Initial Mock Data
    const INITIAL_JOBS = [
      {
        id: 'job-1',
        title: 'Senior Frontend Engineer (React & TypeScript)',
        companyName: 'Nexus Cloud Systems',
        companyLogo: 'https://images.unsplash.com/photo-1599305445671-ac291c95aaa9?w=160&auto=format&fit=crop&q=80',
        location: 'San Francisco, CA',
        workplaceType: 'Remote',
        jobType: 'Full-time',
        category: 'Software Engineering',
        experienceLevel: 'Senior Level',
        salaryMin: 145000,
        salaryMax: 185000,
        salaryPeriod: 'yearly',
        description: 'Architect and develop modern web applications using React, TypeScript, and Tailwind CSS for distributed cloud observability console.',
        skills: ['React', 'TypeScript', 'Tailwind CSS', 'Next.js', 'State Management'],
        postedDate: '2026-11-04',
        applicantsCount: 28,
        featured: true,
        urgent: true
      },
      {
        id: 'job-2',
        title: 'Lead Product Designer (UI/UX)',
        companyName: 'Kite Design Systems',
        companyLogo: 'https://images.unsplash.com/photo-1572021335469-31706a17aaef?w=160&auto=format&fit=crop&q=80',
        location: 'Chicago, IL',
        workplaceType: 'Hybrid',
        jobType: 'Full-time',
        category: 'Product & Design',
        experienceLevel: 'Lead / Manager',
        salaryMin: 130000,
        salaryMax: 165000,
        salaryPeriod: 'yearly',
        description: 'Lead design vision and execution for enterprise-grade design systems, tokens, and multi-brand Figma libraries.',
        skills: ['Figma', 'UI/UX Design', 'Design Systems', 'User Research', 'Prototyping'],
        postedDate: '2026-11-06',
        applicantsCount: 19,
        featured: true,
        urgent: false
      },
      {
        id: 'job-3',
        title: 'Machine Learning Research Scientist',
        companyName: 'Luminary AI Studios',
        companyLogo: 'https://images.unsplash.com/photo-1620712943543-bcc4688e7485?w=160&auto=format&fit=crop&q=80',
        location: 'Seattle, WA',
        workplaceType: 'Remote',
        jobType: 'Full-time',
        category: 'Data & Artificial Intelligence',
        experienceLevel: 'Senior Level',
        salaryMin: 180000,
        salaryMax: 240000,
        salaryPeriod: 'yearly',
        description: 'Design and train foundation multimodal models for generative video, audio, and asset synthesis.',
        skills: ['Python', 'PyTorch', 'Generative AI', 'Deep Learning', 'Transformers'],
        postedDate: '2026-11-02',
        applicantsCount: 42,
        featured: true,
        urgent: true
      },
      {
        id: 'job-4',
        title: 'Senior FinTech Product Manager',
        companyName: 'Vanguard FinTech Labs',
        companyLogo: 'https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=160&auto=format&fit=crop&q=80',
        location: 'New York, NY',
        workplaceType: 'On-site',
        jobType: 'Full-time',
        category: 'Product Management',
        experienceLevel: 'Senior Level',
        salaryMin: 155000,
        salaryMax: 195000,
        salaryPeriod: 'yearly',
        description: 'Lead roadmap and banking partner integrations for next-generation global settlement engines.',
        skills: ['Product Management', 'FinTech', 'API Design', 'Payments', 'SQL'],
        postedDate: '2026-11-05',
        applicantsCount: 15,
        featured: false,
        urgent: false
      }
    ];

    const INITIAL_APPLICATIONS = [
      {
        id: 'app-1',
        jobId: 'job-1',
        jobTitle: 'Senior Frontend Engineer (React & TypeScript)',
        companyName: 'Nexus Cloud Systems',
        candidateName: 'Alex Morgan',
        candidateEmail: 'alex.morgan@example.com',
        appliedDate: '2026-11-05',
        status: 'Interview',
        skillMatchScore: 92,
        resumeFileName: 'Alex_Morgan_Senior_Frontend_Resume.pdf',
        interviewDate: '2026-11-14T15:00:00Z',
        notes: 'High score on frontend architectural assessment. Scheduled for technical interview.'
      },
      {
        id: 'app-2',
        jobId: 'job-2',
        jobTitle: 'Lead Product Designer (UI/UX)',
        companyName: 'Kite Design Systems',
        candidateName: 'David Chen',
        candidateEmail: 'david.chen@example.com',
        appliedDate: '2026-11-06',
        status: 'Shortlisted',
        skillMatchScore: 88,
        resumeFileName: 'David_Chen_Product_Design.pdf',
        notes: 'Strong Figma portfolio case studies.'
      }
    ];

    // Main App Component
    function StandaloneApp() {
      const [role, setRole] = useState('candidate'); // 'candidate', 'employer', 'admin'
      const [currentView, setCurrentView] = useState('home'); // 'home', 'jobs', 'cv', 'dashboard', 'applicants', 'post-job', 'admin-users'
      const [jobs, setJobs] = useState(INITIAL_JOBS);
      const [applications, setApplications] = useState(INITIAL_APPLICATIONS);
      const [savedJobs, setSavedJobs] = useState(['job-1']);
      const [toast, setToast] = useState(null);

      // Search & Filters
      const [keyword, setKeyword] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('');
      const [workplaceFilter, setWorkplaceFilter] = useState('');
      const [minSalary, setMinSalary] = useState(0);

      // Apply Modal
      const [applyJob, setApplyJob] = useState(null);
      const [appliedFile, setAppliedFile] = useState('Alex_Morgan_Resume.pdf');
      const [appliedNote, setAppliedNote] = useState('Excited to apply for this opening!');

      // Post Job Form
      const [postTitle, setPostTitle] = useState('');
      const [postCategory, setPostCategory] = useState('Software Engineering');
      const [postSalaryMin, setPostSalaryMin] = useState(130000);
      const [postSalaryMax, setPostSalaryMax] = useState(170000);
      const [postDesc, setPostDesc] = useState('');

      // CV Builder State
      const [cvName, setCvName] = useState('Alex Morgan');
      const [cvTitle, setCvTitle] = useState('Senior Frontend & UI Engineer');
      const [cvEmail, setCvEmail] = useState('alex.morgan@example.com');
      const [cvPhone, setCvPhone] = useState('+1 (555) 234-5678');
      const [cvSummary, setCvSummary] = useState('Experienced frontend engineer specializing in scalable React ecosystems, TypeScript architectures, and accessible UI component libraries.');
      const [cvTemplate, setCvTemplate] = useState('teal'); // 'teal' or 'navy'

      const showToast = (title, msg) => {
        setToast({ title, msg });
        setTimeout(() => setToast(null), 3500);
      };

      const handleToggleSave = (jobId) => {
        if (savedJobs.includes(jobId)) {
          setSavedJobs(savedJobs.filter(id => id !== jobId));
          showToast('Job Removed', 'Bookmark removed from saved list.');
        } else {
          setSavedJobs([...savedJobs, jobId]);
          showToast('Job Saved!', 'Position added to your saved bookmarks.');
        }
      };

      const handleApplySubmit = (e) => {
        e.preventDefault();
        const newApp = {
          id: `app-${Date.now()}`,
          jobId: applyJob.id,
          jobTitle: applyJob.title,
          companyName: applyJob.companyName,
          candidateName: 'Alex Morgan',
          candidateEmail: 'alex.morgan@example.com',
          appliedDate: new Date().toISOString().split('T')[0],
          status: 'Pending',
          skillMatchScore: 92,
          resumeFileName: appliedFile,
          notes: 'Under review by hiring squad.'
        };
        setApplications([newApp, ...applications]);
        setApplyJob(null);
        showToast('Application Submitted! 🎉 (Demo)', `Applied to ${applyJob.title} at ${applyJob.companyName}.`);
      };

      const handleCreateJob = (e) => {
        e.preventDefault();
        const newJob = {
          id: `job-${Date.now()}`,
          title: postTitle,
          companyName: 'Nexus Cloud Systems',
          companyLogo: 'https://images.unsplash.com/photo-1599305445671-ac291c95aaa9?w=160&auto=format&fit=crop&q=80',
          location: 'San Francisco, CA or Remote',
          workplaceType: 'Remote',
          jobType: 'Full-time',
          category: postCategory,
          experienceLevel: 'Senior Level',
          salaryMin: Number(postSalaryMin),
          salaryMax: Number(postSalaryMax),
          salaryPeriod: 'yearly',
          description: postDesc || 'Exciting engineering role building distributed cloud systems.',
          skills: ['React', 'TypeScript', 'Node.js'],
          postedDate: new Date().toISOString().split('T')[0],
          applicantsCount: 0,
          featured: true,
          urgent: false
        };
        setJobs([newJob, ...jobs]);
        setPostTitle('');
        setPostDesc('');
        showToast('Job Published! (Demo)', `"${newJob.title}" is now live in the job feed.`);
        setCurrentView('jobs');
      };

      const handleUpdateAppStatus = (appId, newStatus) => {
        setApplications(applications.map(a => a.id === appId ? { ...a, status: newStatus } : a));
        showToast('Candidate Stage Updated (Demo)', `Application status changed to ${newStatus}.`);
      };

      // Filtered Jobs
      const filteredJobs = useMemo(() => {
        return jobs.filter(j => {
          if (keyword && !j.title.toLowerCase().includes(keyword.toLowerCase()) && !j.skills.some(s => s.toLowerCase().includes(keyword.toLowerCase()))) return false;
          if (categoryFilter && j.category !== categoryFilter) return false;
          if (workplaceFilter && j.workplaceType !== workplaceFilter) return false;
          if (minSalary > 0 && j.salaryMax < minSalary) return false;
          return true;
        });
      }, [jobs, keyword, categoryFilter, workplaceFilter, minSalary]);

      return (
        <div className="min-h-screen flex flex-col bg-surface text-slate-800">
          {/* Header */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200/80 shadow-soft no-print">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex items-center justify-between gap-4">
              {/* Brand Logo */}
              <div className="flex items-center gap-6">
                <button onClick={() => setCurrentView('home')} className="flex items-center gap-2.5 text-left focus:outline-none">
                  <div className="w-10 h-10 rounded-xl bg-navy-800 flex items-center justify-center text-white font-extrabold text-base shadow-sm">
                    f<span className="text-teal-400">f</span>
                  </div>
                  <div>
                    <span className="text-xl font-extrabold tracking-tight text-navy-800 leading-none block">
                      find <span className="text-teal-500">for</span>
                    </span>
                    <span className="text-[10px] font-bold tracking-wider uppercase text-slate-400">Careers & Talent</span>
                  </div>
                </button>

                {/* Nav items */}
                <nav className="hidden md:flex items-center gap-1 text-xs font-bold">
                  <button onClick={() => setCurrentView('jobs')} className={`px-3 py-2 rounded-lg transition-colors ${currentView === 'jobs' ? 'bg-teal-50 text-teal-700' : 'text-slate-600 hover:bg-slate-50'}`}>Find Jobs</button>
                  <button onClick={() => setCurrentView('cv')} className={`px-3 py-2 rounded-lg transition-colors ${currentView === 'cv' ? 'bg-amber-50 text-amber-800' : 'text-slate-600 hover:bg-slate-50'}`}>✨ CV Builder</button>
                  <button onClick={() => setCurrentView('dashboard')} className={`px-3 py-2 rounded-lg transition-colors ${currentView === 'dashboard' ? 'bg-teal-50 text-teal-700' : 'text-slate-600 hover:bg-slate-50'}`}>My Applications</button>
                  {role === 'employer' && (
                    <>
                      <button onClick={() => setCurrentView('applicants')} className={`px-3 py-2 rounded-lg transition-colors ${currentView === 'applicants' ? 'bg-teal-50 text-teal-700' : 'text-slate-600 hover:bg-slate-50'}`}>Applicants Pipeline</button>
                      <button onClick={() => setCurrentView('post-job')} className={`px-3 py-2 rounded-lg transition-colors ${currentView === 'post-job' ? 'bg-teal-50 text-teal-700' : 'text-slate-600 hover:bg-slate-50'}`}>+ Post a Job</button>
                    </>
                  )}
                </nav>
              </div>

              {/* Role Switcher Pill */}
              <div className="flex items-center gap-3">
                <div className="flex items-center gap-1.5 p-1 bg-slate-100 rounded-xl border border-slate-200 text-xs font-bold">
                  <span className="text-slate-400 pl-2">Role:</span>
                  <button onClick={() => setRole('candidate')} className={`px-2.5 py-1 rounded-lg transition-all ${role === 'candidate' ? 'bg-navy-800 text-white shadow-sm' : 'text-slate-600 hover:text-navy-800'}`}>Candidate</button>
                  <button onClick={() => setRole('employer')} className={`px-2.5 py-1 rounded-lg transition-all ${role === 'employer' ? 'bg-teal-500 text-navy-950 shadow-sm' : 'text-slate-600 hover:text-navy-800'}`}>Employer</button>
                  <button onClick={() => setRole('admin')} className={`px-2.5 py-1 rounded-lg transition-all ${role === 'admin' ? 'bg-amber-400 text-navy-950 shadow-sm' : 'text-slate-600 hover:text-navy-800'}`}>Admin</button>
                </div>
              </div>
            </div>
          </header>

          {/* Main Body */}
          <main className="flex-1">
            {/* VIEW: HOME */}
            {currentView === 'home' && (
              <div className="space-y-16 pb-16">
                {/* Hero */}
                <section className="bg-navy-900 text-white py-16 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
                  <div className="max-w-4xl mx-auto text-center space-y-4">
                    <span className="inline-block px-3 py-1 rounded-full bg-teal-500/20 text-teal-300 text-xs font-bold border border-teal-400/30">
                      🚀 find for • Modern Recruitment Platform
                    </span>
                    <h1 className="text-4xl sm:text-6xl font-black tracking-tight leading-tight">
                      Find your dream role. Advance your journey.
                    </h1>
                    <p className="text-sm sm:text-base text-slate-300 max-w-2xl mx-auto">
                      Connect directly with verified tech startups, healthcare pioneers, and Fortune 500 enterprises hiring top talent.
                    </p>

                    {/* Search Bar */}
                    <div className="pt-6 max-w-2xl mx-auto">
                      <div className="bg-white p-2 sm:p-3 rounded-2xl shadow-soft-xl flex flex-col sm:flex-row gap-2 text-slate-800">
                        <input
                          type="text"
                          value={keyword}
                          onChange={(e) => setKeyword(e.target.value)}
                          placeholder="Job title or skill (e.g. React, UX, Python)..."
                          className="flex-1 px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:border-teal-500 font-medium"
                        />
                        <button
                          onClick={() => setCurrentView('jobs')}
                          className="px-6 py-2.5 bg-navy-800 hover:bg-navy-700 text-white font-bold text-xs sm:text-sm rounded-xl shadow-soft"
                        >
                          Find Jobs ({jobs.length})
                        </button>
                      </div>
                    </div>

                    <div className="pt-4 flex flex-wrap justify-center gap-3">
                      <button onClick={() => setCurrentView('jobs')} className="px-5 py-2.5 bg-teal-500 hover:bg-teal-400 text-navy-950 font-bold text-xs rounded-xl shadow-soft">Browse All Positions</button>
                      <button onClick={() => setCurrentView('cv')} className="px-5 py-2.5 bg-white/10 hover:bg-white/20 text-white font-bold text-xs rounded-xl border border-white/20">Try ATS CV Builder</button>
                    </div>
                  </div>
                </section>

                {/* Stats */}
                <div className="max-w-7xl mx-auto px-4">
                  <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-soft-sm grid grid-cols-2 lg:grid-cols-4 gap-6 text-center">
                    <div><p className="text-3xl font-black text-navy-800">12,450+</p><p className="text-xs text-slate-500 font-bold uppercase mt-1">Active Openings</p></div>
                    <div><p className="text-3xl font-black text-teal-600">3,200+</p><p className="text-xs text-slate-500 font-bold uppercase mt-1">Verified Employers</p></div>
                    <div><p className="text-3xl font-black text-amber-500">88,000+</p><p className="text-xs text-slate-500 font-bold uppercase mt-1">Candidates</p></div>
                    <div><p className="text-3xl font-black text-navy-800">94.8%</p><p className="text-xs text-slate-500 font-bold uppercase mt-1">Hiring Satisfaction</p></div>
                  </div>
                </div>

                {/* Featured Jobs Preview */}
                <div className="max-w-7xl mx-auto px-4 space-y-6">
                  <div className="flex justify-between items-end">
                    <div>
                      <span className="text-xs font-bold text-teal-600 uppercase tracking-wider">Top Positions</span>
                      <h2 className="text-2xl font-black text-navy-800 mt-1">Featured Job Openings</h2>
                    </div>
                    <button onClick={() => setCurrentView('jobs')} className="text-xs font-bold text-teal-600 hover:underline">View All &rarr;</button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {jobs.slice(0, 3).map(job => (
                      <div key={job.id} className="bg-white rounded-2xl border border-slate-200 p-6 shadow-soft-sm flex flex-col justify-between hover:border-teal-400 transition-all">
                        <div>
                          <div className="flex items-center justify-between mb-3">
                            <span className="text-xs font-bold text-teal-700 bg-teal-50 px-2 py-0.5 rounded-full">{job.workplaceType}</span>
                            <button onClick={() => handleToggleSave(job.id)} className={`text-xs p-1 rounded ${savedJobs.includes(job.id) ? 'text-amber-500 font-bold' : 'text-slate-400'}`}>
                              ★ {savedJobs.includes(job.id) ? 'Saved' : 'Save'}
                            </button>
                          </div>
                          <h3 className="text-base font-bold text-navy-800 leading-snug">{job.title}</h3>
                          <p className="text-xs text-slate-500 font-semibold mt-1">{job.companyName} • {job.location}</p>
                          <p className="text-xs text-slate-600 mt-2 line-clamp-2">{job.description}</p>
                          <div className="flex flex-wrap gap-1 mt-3">
                            {job.skills.map((s, i) => <span key={i} className="text-[10px] bg-slate-100 text-slate-700 px-2 py-0.5 rounded font-medium">{s}</span>)}
                          </div>
                        </div>
                        <div className="mt-4 pt-4 border-t border-slate-100 flex items-center justify-between">
                          <span className="text-xs font-extrabold text-navy-800">${Math.round(job.salaryMin/1000)}k - ${Math.round(job.salaryMax/1000)}k/yr</span>
                          <button onClick={() => setApplyJob(job)} className="px-3.5 py-1.5 bg-teal-500 hover:bg-teal-600 text-white font-bold text-xs rounded-xl shadow-sm">Quick Apply</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* VIEW: FIND JOBS */}
            {currentView === 'jobs' && (
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
                <div className="pb-4 border-b border-slate-200">
                  <h1 className="text-2xl sm:text-3xl font-extrabold text-navy-800">Explore Open Positions</h1>
                  <p className="text-xs text-slate-500 mt-1">Showing {filteredJobs.length} active roles in real-time.</p>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                  {/* Filters Left */}
                  <div className="lg:col-span-4 bg-white rounded-2xl border border-slate-200 p-5 shadow-soft-sm space-y-4">
                    <h3 className="text-xs font-bold text-navy-800 uppercase tracking-wider">Search Filters</h3>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-600 mb-1">Keyword</label>
                      <input type="text" value={keyword} onChange={(e) => setKeyword(e.target.value)} placeholder="Title or skill..." className="w-full px-3 py-2 bg-slate-50 border rounded-xl text-xs text-navy-800" />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-600 mb-1">Workplace Model</label>
                      <select value={workplaceFilter} onChange={(e) => setWorkplaceFilter(e.target.value)} className="w-full px-3 py-2 bg-slate-50 border rounded-xl text-xs text-navy-800">
                        <option value="">Any Model</option>
                        <option value="Remote">Remote</option>
                        <option value="Hybrid">Hybrid</option>
                        <option value="On-site">On-site</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-600 mb-1">Minimum Annual Salary</label>
                      <input type="range" min="0" max="200000" step="10000" value={minSalary} onChange={(e) => setMinSalary(Number(e.target.value))} className="w-full accent-teal-500" />
                      <div className="flex justify-between text-[10px] text-slate-400 mt-1"><span>$0</span><span>${minSalary.toLocaleString()}</span><span>$200k+</span></div>
                    </div>
                    <button onClick={() => { setKeyword(''); setWorkplaceFilter(''); setMinSalary(0); }} className="w-full py-2 text-xs font-bold text-slate-600 hover:text-navy-800 bg-slate-100 rounded-xl">Clear Filters</button>
                  </div>

                  {/* Jobs Feed Right */}
                  <div className="lg:col-span-8 space-y-4">
                    {filteredJobs.map(job => (
                      <div key={job.id} className="bg-white rounded-2xl border border-slate-200 p-6 shadow-soft-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4 hover:border-teal-400 transition-all">
                        <div className="space-y-1">
                          <div className="flex items-center gap-2">
                            <h3 className="text-base font-bold text-navy-800">{job.title}</h3>
                            <span className="text-[11px] font-bold text-teal-700 bg-teal-50 px-2 py-0.5 rounded-full">{job.workplaceType}</span>
                          </div>
                          <p className="text-xs text-slate-500 font-semibold">{job.companyName} • {job.location}</p>
                          <p className="text-xs text-slate-600 mt-1">{job.description}</p>
                          <div className="flex flex-wrap gap-1 mt-2">
                            {job.skills.map((s, idx) => <span key={idx} className="text-[10px] bg-slate-100 px-2 py-0.5 rounded text-slate-700">{s}</span>)}
                          </div>
                        </div>

                        <div className="flex sm:flex-col items-center sm:items-end justify-between sm:justify-center gap-2 flex-shrink-0">
                          <span className="text-xs font-extrabold text-navy-800">${Math.round(job.salaryMin/1000)}k - ${Math.round(job.salaryMax/1000)}k/yr</span>
                          <div className="flex items-center gap-2">
                            <button onClick={() => handleToggleSave(job.id)} className="p-2 border rounded-xl text-slate-400 hover:text-navy-800">★</button>
                            <button onClick={() => setApplyJob(job)} className="px-4 py-2 bg-teal-500 hover:bg-teal-600 text-white font-bold text-xs rounded-xl shadow-soft">Apply</button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* VIEW: CV BUILDER */}
            {currentView === 'cv' && (
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-4 border-b border-slate-200 no-print">
                  <div>
                    <h1 className="text-2xl sm:text-3xl font-extrabold text-navy-800">ATS Resume Builder</h1>
                    <p className="text-xs text-slate-500 mt-1">Live editable multi-template generator with Print-to-PDF export.</p>
                  </div>
                  <div className="flex items-center gap-2">
                    <div className="bg-slate-100 p-1 rounded-xl flex text-xs font-bold">
                      <button onClick={() => setCvTemplate('teal')} className={`px-3 py-1.5 rounded-lg ${cvTemplate === 'teal' ? 'bg-white text-teal-700 shadow-sm' : 'text-slate-600'}`}>Modern Teal</button>
                      <button onClick={() => setCvTemplate('navy')} className={`px-3 py-1.5 rounded-lg ${cvTemplate === 'navy' ? 'bg-white text-navy-800 shadow-sm' : 'text-slate-600'}`}>Classic Executive</button>
                    </div>
                    <button onClick={() => window.print()} className="px-4 py-2 bg-teal-500 hover:bg-teal-600 text-white font-bold text-xs rounded-xl shadow-soft">Download / Print PDF</button>
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                  {/* Left Form */}
                  <div className="lg:col-span-5 bg-white rounded-2xl border border-slate-200 p-6 shadow-soft-sm space-y-4 no-print text-xs">
                    <h3 className="font-bold text-navy-800 uppercase tracking-wider text-[11px]">Personal Details</h3>
                    <div><label className="block font-bold text-slate-600 mb-1">Full Name</label><input type="text" value={cvName} onChange={(e) => setCvName(e.target.value)} className="w-full px-3 py-2 bg-slate-50 border rounded-xl" /></div>
                    <div><label className="block font-bold text-slate-600 mb-1">Professional Title</label><input type="text" value={cvTitle} onChange={(e) => setCvTitle(e.target.value)} className="w-full px-3 py-2 bg-slate-50 border rounded-xl" /></div>
                    <div className="grid grid-cols-2 gap-2">
                      <div><label className="block font-bold text-slate-600 mb-1">Email</label><input type="email" value={cvEmail} onChange={(e) => setCvEmail(e.target.value)} className="w-full px-3 py-2 bg-slate-50 border rounded-xl" /></div>
                      <div><label className="block font-bold text-slate-600 mb-1">Phone</label><input type="text" value={cvPhone} onChange={(e) => setCvPhone(e.target.value)} className="w-full px-3 py-2 bg-slate-50 border rounded-xl" /></div>
                    </div>
                    <div><label className="block font-bold text-slate-600 mb-1">Executive Summary</label><textarea rows="4" value={cvSummary} onChange={(e) => setCvSummary(e.target.value)} className="w-full px-3 py-2 bg-slate-50 border rounded-xl leading-relaxed" /></div>
                  </div>

                  {/* Right Live Preview */}
                  <div className="lg:col-span-7 bg-white p-8 rounded-2xl border border-slate-300 shadow-soft-sm">
                    {cvTemplate === 'teal' ? (
                      <div className="border-b-2 border-teal-500 pb-4 mb-4 text-left">
                        <h2 className="text-3xl font-black text-navy-800">{cvName}</h2>
                        <p className="text-sm font-bold text-teal-600 mt-0.5">{cvTitle}</p>
                        <p className="text-xs text-slate-500 mt-2">{cvEmail} • {cvPhone} • San Francisco, CA</p>
                        <h4 className="text-xs font-bold uppercase text-teal-700 tracking-wider mt-5 mb-1">Professional Summary</h4>
                        <p className="text-xs text-slate-700 leading-relaxed">{cvSummary}</p>
                        <h4 className="text-xs font-bold uppercase text-teal-700 tracking-wider mt-5 mb-1">Core Competencies</h4>
                        <p className="text-xs text-slate-700">React • TypeScript • Tailwind CSS • Next.js • Design Systems • Web Performance</p>
                      </div>
                    ) : (
                      <div className="border-b border-navy-800 pb-4 mb-4 text-center font-serif text-left">
                        <h2 className="text-2xl font-bold uppercase text-navy-800">{cvName}</h2>
                        <p className="text-xs italic text-slate-600 mt-0.5">{cvTitle}</p>
                        <p className="text-xs text-slate-500 mt-2">{cvEmail} | {cvPhone} | San Francisco, CA</p>
                        <h4 className="text-xs font-bold uppercase text-navy-800 tracking-widest mt-5 mb-1 font-sans border-b pb-1">Executive Summary</h4>
                        <p className="text-xs text-slate-800 leading-relaxed font-sans">{cvSummary}</p>
                        <h4 className="text-xs font-bold uppercase text-navy-800 tracking-widest mt-5 mb-1 font-sans border-b pb-1">Technical Skills</h4>
                        <p className="text-xs text-slate-800 font-sans">React • TypeScript • Tailwind CSS • UI Architecture</p>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* VIEW: MY APPLICATIONS (Candidate Dashboard) */}
            {currentView === 'dashboard' && (
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
                <div className="pb-4 border-b border-slate-200">
                  <h1 className="text-2xl sm:text-3xl font-extrabold text-navy-800">My Applications & Progress</h1>
                  <p className="text-xs text-slate-500 mt-1">Real-time candidate workflow stages.</p>
                </div>

                <div className="space-y-4">
                  {applications.map(app => (
                    <div key={app.id} className="bg-white rounded-2xl border border-slate-200 p-6 shadow-soft-sm space-y-4">
                      <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <div>
                          <h3 className="text-base font-bold text-navy-800">{app.jobTitle}</h3>
                          <p className="text-xs text-slate-500">{app.companyName} • Applied on {app.appliedDate}</p>
                        </div>
                        <span className="px-3 py-1 rounded-full text-xs font-bold bg-teal-50 text-teal-800 border border-teal-200">{app.status}</span>
                      </div>

                      {/* 4-Step Pipeline Visualizer */}
                      <div className="grid grid-cols-4 gap-2 pt-2 text-center text-xs">
                        <div className="p-2 bg-teal-50 text-teal-800 font-bold rounded-lg">1. Submitted</div>
                        <div className={`p-2 rounded-lg font-bold ${app.status === 'Shortlisted' || app.status === 'Interview' || app.status === 'Hired' ? 'bg-teal-50 text-teal-800' : 'bg-slate-100 text-slate-400'}`}>2. Shortlisted</div>
                        <div className={`p-2 rounded-lg font-bold ${app.status === 'Interview' || app.status === 'Hired' ? 'bg-teal-50 text-teal-800' : 'bg-slate-100 text-slate-400'}`}>3. Interview</div>
                        <div className={`p-2 rounded-lg font-bold ${app.status === 'Hired' ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-400'}`}>4. Outcome</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* VIEW: EMPLOYER APPLICANTS PIPELINE */}
            {currentView === 'applicants' && (
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
                <div className="pb-4 border-b border-slate-200">
                  <h1 className="text-2xl sm:text-3xl font-extrabold text-navy-800">Employer Candidate Pipeline</h1>
                  <p className="text-xs text-slate-500 mt-1">One-click status transitions update both candidate & employer state instantly.</p>
                </div>

                <div className="space-y-4">
                  {applications.map(app => (
                    <div key={app.id} className="bg-white rounded-2xl border border-slate-200 p-6 shadow-soft-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                      <div>
                        <div className="flex items-center gap-2">
                          <h3 className="text-base font-bold text-navy-800">{app.candidateName}</h3>
                          <span className="text-xs font-bold text-teal-700 bg-teal-50 px-2 py-0.5 rounded-full">{app.skillMatchScore}% Match</span>
                        </div>
                        <p className="text-xs text-slate-600 font-medium">Applied for: {app.jobTitle}</p>
                        <p className="text-xs text-slate-400">{app.candidateEmail} • {app.appliedDate}</p>
                      </div>

                      <div className="flex items-center gap-2">
                        <button onClick={() => handleUpdateAppStatus(app.id, 'Shortlisted')} className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-lg">Shortlist</button>
                        <button onClick={() => handleUpdateAppStatus(app.id, 'Interview')} className="px-3 py-1.5 bg-teal-50 hover:bg-teal-100 text-teal-700 text-xs font-bold rounded-lg">Interview</button>
                        <button onClick={() => handleUpdateAppStatus(app.id, 'Hired')} className="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-bold rounded-lg">Hire</button>
                        <button onClick={() => handleUpdateAppStatus(app.id, 'Rejected')} className="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-bold rounded-lg">Reject</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* VIEW: POST A JOB */}
            {currentView === 'post-job' && (
              <div className="max-w-3xl mx-auto px-4 py-8 space-y-6">
                <div className="pb-4 border-b border-slate-200">
                  <h1 className="text-2xl sm:text-3xl font-extrabold text-navy-800">Post a New Job Opening</h1>
                  <p className="text-xs text-slate-500 mt-1">Saves immediately to local session state for the public feed.</p>
                </div>

                <form onSubmit={handleCreateJob} className="bg-white rounded-2xl border border-slate-200 p-6 shadow-soft-sm space-y-4 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Job Title *</label>
                    <input type="text" required value={postTitle} onChange={(e) => setPostTitle(e.target.value)} placeholder="e.g. Staff Distributed Cloud Architect" className="w-full px-3 py-2 bg-slate-50 border rounded-xl" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Min Salary ($/yr)</label>
                      <input type="number" value={postSalaryMin} onChange={(e) => setPostSalaryMin(e.target.value)} className="w-full px-3 py-2 bg-slate-50 border rounded-xl" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Max Salary ($/yr)</label>
                      <input type="number" value={postSalaryMax} onChange={(e) => setPostSalaryMax(e.target.value)} className="w-full px-3 py-2 bg-slate-50 border rounded-xl" />
                    </div>
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Description *</label>
                    <textarea rows="4" required value={postDesc} onChange={(e) => setPostDesc(e.target.value)} placeholder="Describe responsibilities and mission..." className="w-full px-3 py-2 bg-slate-50 border rounded-xl leading-relaxed" />
                  </div>
                  <button type="submit" className="w-full py-3 bg-teal-500 hover:bg-teal-600 text-white font-bold text-sm rounded-xl shadow-soft">Publish Job Live (Demo)</button>
                </form>
              </div>
            )}
          </main>

          {/* Quick Apply Modal */}
          {applyJob && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-navy-950/60 backdrop-blur-sm">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-soft-xl border border-slate-200 space-y-4 text-xs">
                <div className="flex justify-between items-start border-b pb-3">
                  <div>
                    <h3 className="text-base font-bold text-navy-800">Apply for Position</h3>
                    <p className="text-slate-500">{applyJob.title} • {applyJob.companyName}</p>
                  </div>
                  <button onClick={() => setApplyJob(null)} className="text-slate-400 font-bold p-1">✕</button>
                </div>

                <div className="p-3 bg-teal-50 border border-teal-200 rounded-xl space-y-1">
                  <div className="flex justify-between font-bold text-navy-800">
                    <span>Simulated Skill Match:</span>
                    <span className="text-teal-700">92% Match</span>
                  </div>
                  <p className="text-slate-600">✓ React, TypeScript, Tailwind CSS, State Management</p>
                </div>

                <div>
                  <label className="block font-bold text-slate-700 mb-1">Attached Resume</label>
                  <input type="text" value={appliedFile} onChange={(e) => setAppliedFile(e.target.value)} className="w-full px-3 py-2 bg-slate-50 border rounded-xl text-navy-800 font-bold" />
                </div>

                <div>
                  <label className="block font-bold text-slate-700 mb-1">Short Cover Note</label>
                  <textarea rows="3" value={appliedNote} onChange={(e) => setAppliedNote(e.target.value)} className="w-full px-3 py-2 bg-slate-50 border rounded-xl text-navy-800" />
                </div>

                <div className="flex justify-end gap-2 pt-2 border-t">
                  <button onClick={() => setApplyJob(null)} className="px-4 py-2 font-bold text-slate-600">Cancel</button>
                  <button onClick={handleApplySubmit} className="px-5 py-2.5 bg-teal-500 hover:bg-teal-600 text-white font-bold rounded-xl shadow-soft">Submit Application (Demo)</button>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 bg-white border-l-4 border-teal-500 shadow-soft-xl p-4 rounded-xl border border-slate-200 max-w-sm">
              <p className="font-bold text-sm text-navy-800">{toast.title}</p>
              {toast.msg && <p className="text-xs text-slate-600 mt-0.5">{toast.msg}</p>}
            </div>
          )}

          {/* Footer */}
          <footer className="bg-navy-900 text-slate-400 py-10 border-t border-navy-800 text-xs no-print">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
              <div className="flex items-center gap-2">
                <span className="w-2 h-2 rounded-full bg-teal-400"></span>
                <span>&copy; 2026 find for. Frontend prototype. All actions stored in browser memory.</span>
              </div>
              <div className="flex gap-4">
                <button onClick={() => setCurrentView('jobs')} className="hover:text-white">Find Jobs</button>
                <button onClick={() => setCurrentView('cv')} className="hover:text-white">CV Builder</button>
                <button onClick={() => setCurrentView('dashboard')} className="hover:text-white">Candidate Dashboard</button>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StandaloneApp />);
  </script>
</body>
</html>
